name: Deploy Douly Ops Control Center

on:
  push:
    branches:
      - main
    paths:
      - 'deployments/ops-control-center.json'

permissions:
  contents: read

concurrency:
  group: douly-ops-control-center-production
  cancel-in-progress: false

jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      DOULY_REPO_READ_TOKEN: ${{ secrets.DOULY_REPO_READ_TOKEN }}
    outputs:
      source_sha: ${{ steps.marker.outputs.source_sha }}
    steps:
      - name: Checkout canonical release policy
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Read immutable ops deployment marker
        id: marker
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const marker = JSON.parse(fs.readFileSync('deployments/ops-control-center.json', 'utf8'));
          const sha = String(marker.source_sha || '');
          if (!/^[0-9a-f]{40}$/.test(sha)) throw new Error('source_sha must be an exact lowercase 40-character SHA');
          if (marker.source_repo !== 'andrexgt2/Douly') throw new Error('Unexpected source_repo');
          if (marker.hostname !== 'ops.douly.family') throw new Error('Unexpected hostname');
          if (marker.confirm !== 'DEPLOY') throw new Error('Explicit DEPLOY confirmation missing');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `source_sha=${sha}\n`);
          NODE

      - name: Verify exact-SHA ops release gate
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.marker.outputs.source_sha }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const token = process.env.DOULY_REPO_READ_TOKEN;
          const sha = process.env.SOURCE_SHA;
          const repo = 'andrexgt2/Douly';
          if (!token) throw new Error('Missing DOULY_REPO_READ_TOKEN');
          const headers = {
            Authorization: `Bearer ${token}`,
            Accept: 'application/vnd.github+json',
            'X-GitHub-Api-Version': '2022-11-28'
          };
          async function github(path) {
            const response = await fetch(`https://api.github.com${path}`, { headers });
            const text = await response.text();
            if (!response.ok) throw new Error(`${response.status} ${response.statusText}: ${text}`);
            return text ? JSON.parse(text) : null;
          }
          (async () => {
            await github(`/repos/${repo}/commits/${sha}`);
            const compare = await github(`/repos/${repo}/compare/${sha}...main`);
            if (!['identical', 'ahead'].includes(compare.status)) {
              throw new Error(`source_sha is not contained in Douly/main: ${compare.status}`);
            }
            const statuses = await github(`/repos/${repo}/commits/${sha}/statuses?per_page=100`);
            const latestRepo = statuses
              .filter(row => row.context === 'douly/repository-validation')
              .sort((a, b) => Date.parse(b.created_at || 0) - Date.parse(a.created_at || 0))[0];
            if (!latestRepo || latestRepo.state !== 'success') {
              throw new Error('Exact source SHA is missing repository-validation PASS');
            }
            const file = await github(`/repos/${repo}/contents/ops/control-center/wrangler.jsonc?ref=${sha}`);
            const config = JSON.parse(Buffer.from(file.content, 'base64').toString('utf8'));
            const route = Array.isArray(config.routes) ? config.routes.find(r => r.pattern === 'ops.douly.family') : null;
            if (config.name !== 'douly-ops-control-center') throw new Error('Unexpected Worker name');
            if (config.workers_dev !== false) throw new Error('workers_dev must be false');
            if (!route || route.custom_domain !== true) throw new Error('ops.douly.family custom domain is not pinned in source config');
            console.log(`Ops release gate PASS for exact SHA ${sha}`);
          })().catch(error => { console.error(error.stack || error.message); process.exit(1); });
          NODE

  deploy:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DOULY_REPO_READ_TOKEN: ${{ secrets.DOULY_REPO_READ_TOKEN }}
      SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
    steps:
      - name: Verify protected production credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          test -n "${DOULY_REPO_READ_TOKEN:-}" || { echo 'Missing DOULY_REPO_READ_TOKEN'; exit 1; }

      - name: Checkout exact approved Douly SHA
        uses: actions/checkout@v4
        with:
          repository: andrexgt2/Douly
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.DOULY_REPO_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: douly

      - name: Verify immutable checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C douly rev-parse HEAD)" = "$SOURCE_SHA" || {
            echo 'Checked-out Douly SHA does not match approved ops SHA'
            exit 1
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy isolated Control Center to Cloudflare
        working-directory: douly/ops/control-center
        run: npx --yes wrangler@4 deploy --config wrangler.jsonc

      - name: Confirm Worker deployment state
        working-directory: douly/ops/control-center
        run: npx --yes wrangler@4 deployments status --name douly-ops-control-center --config wrangler.jsonc

      - name: Smoke test custom domain
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --location --max-time 10 https://ops.douly.family/ >/dev/null; then
              echo 'ops.douly.family is reachable'
              exit 0
            fi
            sleep 5
          done
          echo 'Custom domain did not become reachable during smoke test'
          exit 1

name: Deploy Douly marketing site

on:
  push:
    branches:
      - main
    paths:
      - deployments/marketing-production.json

permissions:
  contents: read

concurrency:
  group: douly-marketing-production
  cancel-in-progress: false

jobs:
  request:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.marker.outputs.source_sha }}
      confirm: ${{ steps.marker.outputs.confirm }}
    steps:
      - name: Checkout canonical release policy
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate marketing deployment request
        id: marker
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const marker = JSON.parse(fs.readFileSync('deployments/marketing-production.json', 'utf8'));
          const sha = String(marker.source_sha || '');
          const confirm = String(marker.confirm || '');
          if (!/^[0-9a-f]{40}$/.test(sha)) throw new Error('source_sha must be an exact lowercase 40-character SHA');
          if (marker.source_repo !== 'andrexgt2/Douly') throw new Error('Unexpected source_repo');
          if (marker.worker !== 'douly-family') throw new Error('Unexpected worker');
          if (marker.hostname !== 'douly.family') throw new Error('Unexpected hostname');
          if (!['NO', 'DEPLOY'].includes(confirm)) throw new Error('confirm must be NO or DEPLOY');
          if (confirm === 'DEPLOY' && marker.authorized_via !== 'chat-product-owner') {
            throw new Error('Production deploy must declare authorized_via=chat-product-owner');
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `source_sha=${sha}\nconfirm=${confirm}\n`);
          NODE

  deploy:
    needs: request
    if: needs.request.outputs.confirm == 'DEPLOY'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DOULY_REPO_READ_TOKEN: ${{ secrets.DOULY_REPO_READ_TOKEN }}
      SOURCE_SHA: ${{ needs.request.outputs.source_sha }}
    steps:
      - name: Verify protected production credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          test -n "${DOULY_REPO_READ_TOKEN:-}" || { echo 'Missing DOULY_REPO_READ_TOKEN'; exit 1; }

      - name: Verify exact-SHA marketing release boundary
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const token = process.env.DOULY_REPO_READ_TOKEN;
          const sha = process.env.SOURCE_SHA;
          const repo = 'andrexgt2/Douly';
          const headers = {
            Authorization: `Bearer ${token}`,
            Accept: 'application/vnd.github+json',
            'X-GitHub-Api-Version': '2022-11-28'
          };
          async function github(path) {
            const response = await fetch(`https://api.github.com${path}`, { headers });
            const text = await response.text();
            if (!response.ok) throw new Error(`${response.status} ${response.statusText}: ${text}`);
            return text ? JSON.parse(text) : null;
          }
          (async () => {
            await github(`/repos/${repo}/commits/${sha}`);
            const compare = await github(`/repos/${repo}/compare/${sha}...main`);
            if (!['identical', 'ahead'].includes(compare.status)) {
              throw new Error(`source_sha is not contained in Douly/main: ${compare.status}`);
            }
            const file = await github(`/repos/${repo}/contents/marketing-site/wrangler.jsonc?ref=${sha}`);
            const config = JSON.parse(Buffer.from(file.content, 'base64').toString('utf8'));
            if (config.name !== 'douly-family') throw new Error('Unexpected marketing Worker name');
            if (config.assets?.directory !== './dist/') throw new Error('Marketing Worker must deploy ./dist/');
            console.log(`Marketing source boundary PASS for exact SHA ${sha}`);
          })().catch(error => { console.error(error.stack || error.message); process.exit(1); });
          NODE

      - name: Checkout exact approved Douly SHA
        uses: actions/checkout@v4
        with:
          repository: andrexgt2/Douly
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.DOULY_REPO_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: douly

      - name: Verify immutable checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C douly rev-parse HEAD)" = "$SOURCE_SHA" || {
            echo 'Checked-out Douly SHA does not match approved marketing SHA'
            exit 1
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build localized marketing site
        working-directory: douly/marketing-site
        run: bash ./build.sh

      - name: Run marketing contract tests
        working-directory: douly
        run: node --test tests/marketing_conversion.contract.test.js

      - name: Restore public live support configuration
        shell: bash
        working-directory: douly/marketing-site
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 15 \
            https://rfaiwmiohhjnnzixkaxs.supabase.co/functions/v1/marketing-support-config \
            -o dist/support-config.json
          node <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('dist/support-config.json', 'utf8'));
          if (config.provider !== 'Stripe' || config.publicEnabled !== true) throw new Error('Live support config is not enabled');
          if (!/^https:\/\/(buy|donate)\.stripe\.com\//i.test(String(config.livePaymentUrl || ''))) {
            throw new Error('Unexpected live support payment URL');
          }
          if (/\/test_/i.test(config.livePaymentUrl)) throw new Error('Refusing Stripe test URL in production');
          NODE

      - name: Deploy marketing site to Cloudflare
        working-directory: douly/marketing-site
        run: npx --yes wrangler@4 deploy --config wrangler.jsonc

      - name: Confirm marketing Worker deployment state
        working-directory: douly/marketing-site
        run: npx --yes wrangler@4 deployments status --name douly-family --config wrangler.jsonc

      - name: Smoke test public site
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --location --max-time 10 https://douly.family/ | grep -q 'Douly'; then
              echo 'douly.family is reachable'
              exit 0
            fi
            sleep 5
          done
          echo 'douly.family did not pass the smoke test'
          exit 1

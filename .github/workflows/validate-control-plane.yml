name: Validate release control plane

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate workflow allowlist and secret boundary
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const gate = require('./.github/release-control/release_gate.js');
          const dir = '.github/workflows';
          const names = fs.readdirSync(dir).filter(name => /\.ya?ml$/i.test(name));
          const allowlist = gate.validateWorkflowAllowlist(names);
          if (!allowlist.ok) {
            if (allowlist.unexpected.length) console.error('Unexpected workflow(s):', allowlist.unexpected.join(', '));
            if (allowlist.missing.length) console.error('Missing workflow(s):', allowlist.missing.join(', '));
            process.exit(1);
          }

          const sensitive = [
            ['CLOUDFLARE', 'API', 'TOKEN'].join('_'),
            ['CLOUDFLARE', 'ACCOUNT', 'ID'].join('_'),
            ['DOULY', 'REPO', 'READ', 'TOKEN'].join('_')
          ];
          const productionEnvironment = ['environment', 'production'].join(': ');
          const productionEnvironmentPattern = new RegExp(['environment', '\\s*production'].join(':'), 'i');
          const canonicalDeployWorkflows = new Set([
            'deploy-douly.yml',
            'deploy-marketing.yml',
            'deploy-ops-control-center.yml'
          ]);
          for (const name of names) {
            if (canonicalDeployWorkflows.has(name)) continue;
            const text = fs.readFileSync(path.join(dir, name), 'utf8');
            for (const secret of sensitive) {
              if (text.includes(secret)) {
                console.error(`Sensitive secret reference outside canonical deploy workflows: ${name} -> ${secret}`);
                process.exit(1);
              }
            }
            if (productionEnvironmentPattern.test(text)) {
              console.error(`Alternate production environment path detected: ${name}`);
              process.exit(1);
            }
          }

          const markerPath = 'deployments/douly-production.json';
          if (!fs.existsSync(markerPath)) {
            console.error('Missing canonical Douly production request marker');
            process.exit(1);
          }
          const marker = JSON.parse(fs.readFileSync(markerPath, 'utf8'));
          if (typeof marker.release_sha !== 'string' || typeof marker.confirm !== 'string' || typeof marker.request_id !== 'string' || typeof marker.authorized_via !== 'string') {
            console.error('Douly production request marker schema is invalid');
            process.exit(1);
          }

          const marketingMarkerPath = 'deployments/marketing-production.json';
          if (!fs.existsSync(marketingMarkerPath)) {
            console.error('Missing canonical marketing production request marker');
            process.exit(1);
          }
          const marketingMarker = JSON.parse(fs.readFileSync(marketingMarkerPath, 'utf8'));
          if (marketingMarker.source_repo !== 'andrexgt2/Douly' ||
              marketingMarker.worker !== 'douly-family' ||
              marketingMarker.hostname !== 'douly.family' ||
              typeof marketingMarker.source_sha !== 'string' ||
              typeof marketingMarker.confirm !== 'string' ||
              typeof marketingMarker.authorized_via !== 'string') {
            console.error('Marketing production request marker schema is invalid');
            process.exit(1);
          }

          const doulyDeploy = fs.readFileSync(path.join(dir, 'deploy-douly.yml'), 'utf8');
          if (!doulyDeploy.includes('deployments/douly-production.json')) {
            console.error('Canonical deploy workflow must watch the versioned Douly production request marker');
            process.exit(1);
          }
          if (!/^  request:\s*$/m.test(doulyDeploy)) {
            console.error('Canonical deploy workflow must validate request intent before entering production');
            process.exit(1);
          }
          if (!doulyDeploy.includes("authorized_via !== 'chat-product-owner'")) {
            console.error('Push-triggered deploys must require chat-product-owner authorization provenance');
            process.exit(1);
          }

          const marketingDeploy = fs.readFileSync(path.join(dir, 'deploy-marketing.yml'), 'utf8');
          if (!marketingDeploy.includes('deployments/marketing-production.json')) {
            console.error('Canonical marketing deploy workflow must watch the versioned marketing production marker');
            process.exit(1);
          }
          if (!marketingDeploy.includes("marker.authorized_via !== 'chat-product-owner'")) {
            console.error('Marketing deploy must require chat-product-owner authorization provenance');
            process.exit(1);
          }
          if (!marketingDeploy.includes("config.name !== 'douly-family'")) {
            console.error('Marketing deploy must pin the douly-family Worker');
            process.exit(1);
          }
          if (!marketingDeploy.includes('marketing-support-config')) {
            console.error('Marketing deploy must restore the canonical live support configuration');
            process.exit(1);
          }

          // All private-repo and Cloudflare credentials remain inside the
          // production environment job. The preceding request job is secretless.
          const productionGate = doulyDeploy.indexOf(productionEnvironment);
          const repoToken = doulyDeploy.indexOf(sensitive[2]);
          const evidenceCheck = doulyDeploy.indexOf('Verify exact-SHA automated release evidence');
          if (productionGate < 0 || repoToken < productionGate || evidenceCheck < productionGate) {
            console.error('Douly deploy must access private-repo evidence only inside the protected production job');
            process.exit(1);
          }

          const marketingProductionGate = marketingDeploy.indexOf(productionEnvironment);
          const marketingRepoToken = marketingDeploy.indexOf(sensitive[2]);
          const marketingBoundary = marketingDeploy.indexOf('Verify exact-SHA marketing release boundary');
          if (marketingProductionGate < 0 || marketingRepoToken < marketingProductionGate || marketingBoundary < marketingProductionGate) {
            console.error('Marketing deploy must access private-repo source only inside the protected production job');
            process.exit(1);
          }

          console.log('Release control workflow boundary OK');
          NODE

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check .github/release-control/release_gate.js
          node --check tests/release_gate.test.js

      - name: Run release-gate tests
        run: node --test tests/release_gate.test.js

      - name: Verify no application payload is stored here
        shell: bash
        run: |
          set -euo pipefail
          forbidden="$(find . -type f \( -name '*.html' -o -name '*.css' -o -name 'wrangler.jsonc' -o -name 'config.js' -o -name 'sw.js' \) -not -path './.git/*' -print)"
          if [ -n "$forbidden" ]; then
            echo 'Application/deploy payload must remain in private Douly repository:'
            echo "$forbidden"
            exit 1
          fi
          echo 'No Douly application payload present'

name: Deploy Douly production

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: 'Exact 40-character Douly commit SHA'
        required: true
        type: string
      confirm:
        description: 'Production deployment intent'
        required: true
        default: NO
        type: choice
        options:
          - NO
          - DEPLOY
  push:
    branches:
      - main
    paths:
      - deployments/douly-production.json

permissions:
  contents: read

concurrency:
  group: douly-production-deploy
  cancel-in-progress: false

jobs:
  request:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release_sha: ${{ steps.resolve.outputs.release_sha }}
      confirm: ${{ steps.resolve.outputs.confirm }}
      request_id: ${{ steps.resolve.outputs.request_id }}
    steps:
      - name: Checkout canonical release policy
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve and validate production request
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_RELEASE_SHA: ${{ inputs.release_sha }}
          MANUAL_CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');

          const eventName = process.env.EVENT_NAME;
          let request;
          if (eventName === 'workflow_dispatch') {
            request = {
              release_sha: process.env.MANUAL_RELEASE_SHA,
              confirm: process.env.MANUAL_CONFIRM,
              request_id: `manual-${process.env.GITHUB_RUN_ID}`,
              authorized_via: 'github-workflow-dispatch'
            };
          } else if (eventName === 'push') {
            request = JSON.parse(fs.readFileSync('deployments/douly-production.json', 'utf8'));
          } else {
            throw new Error(`Unsupported deployment event: ${eventName}`);
          }

          const sha = String(request.release_sha || '');
          const confirm = String(request.confirm || '');
          const requestId = String(request.request_id || '');
          if (!/^[0-9a-f]{40}$/.test(sha)) throw new Error('release_sha must be an exact lowercase 40-character commit SHA');
          if (!['NO', 'DEPLOY'].includes(confirm)) throw new Error('confirm must be NO or DEPLOY');
          if (!/^[A-Za-z0-9._:-]{3,120}$/.test(requestId)) throw new Error('Invalid request_id');
          if (confirm === 'DEPLOY' && eventName === 'push' && request.authorized_via !== 'chat-product-owner') {
            throw new Error('Push-triggered production deploy must declare authorized_via=chat-product-owner');
          }

          const output = process.env.GITHUB_OUTPUT;
          fs.appendFileSync(output, `release_sha=${sha}\nconfirm=${confirm}\nrequest_id=${requestId}\n`);
          if (confirm === 'DEPLOY') {
            console.log(`Validated production request ${requestId} for ${sha}`);
          } else {
            console.log(`Validated non-deploy request ${requestId}; production job will be skipped`);
          }
          NODE

  deploy:
    needs: request
    if: needs.request.outputs.confirm == 'DEPLOY'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Production credentials remain environment-scoped. This is still the
    # single protected production boundary after a request has passed the
    # secretless syntax/intent check above.
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DOULY_REPO_READ_TOKEN: ${{ secrets.DOULY_REPO_READ_TOKEN }}
      RELEASE_SHA: ${{ needs.request.outputs.release_sha }}
      DEPLOY_REQUEST_ID: ${{ needs.request.outputs.request_id }}
    steps:
      - name: Checkout canonical release policy
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify protected production credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          test -n "${DOULY_REPO_READ_TOKEN:-}" || { echo 'Missing DOULY_REPO_READ_TOKEN'; exit 1; }

      - name: Verify exact-SHA automated release evidence
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const gate = require('./.github/release-control/release_gate.js');
          const token = process.env.DOULY_REPO_READ_TOKEN;
          const sha = process.env.RELEASE_SHA;

          function fail(message) {
            console.error(message);
            process.exit(1);
          }

          if (!gate.validateSha(sha)) fail('release_sha must be an exact lowercase 40-character commit SHA');
          if (!token) fail('Missing DOULY_REPO_READ_TOKEN');

          const headers = {
            Authorization: `Bearer ${token}`,
            Accept: 'application/vnd.github+json',
            'X-GitHub-Api-Version': '2022-11-28'
          };

          async function github(path) {
            const response = await fetch(`https://api.github.com${path}`, { headers });
            const text = await response.text();
            if (!response.ok) throw new Error(`${response.status} ${response.statusText}: ${text}`);
            return text ? JSON.parse(text) : null;
          }

          (async () => {
            const repo = gate.SOURCE_REPO;
            await github(`/repos/${repo}/commits/${sha}`);
            const compare = await github(`/repos/${repo}/compare/${sha}...main`);
            if (!gate.targetIsOnMain(compare.status)) {
              fail(`release_sha is not contained in Douly/main (compare status: ${compare.status})`);
            }

            const statuses = await github(`/repos/${repo}/commits/${sha}/statuses?per_page=100`);
            const result = gate.evaluateRequiredStatuses(statuses, gate.DEPLOY_REQUIRED_CONTEXTS);
            if (!result.ok) {
              for (const item of result.missing) console.error(`Missing automated release status: ${item.context}`);
              for (const item of result.failing) console.error(`Non-PASS automated release status: ${item.context} = ${item.state}`);
              fail('Automated exact-SHA release evidence is not satisfied');
            }
            console.log(`Automated release evidence PASS for exact SHA ${sha}`);
          })().catch(error => fail(error.stack || error.message));
          NODE

      - name: Checkout exact approved Douly SHA
        uses: actions/checkout@v4
        with:
          repository: andrexgt2/Douly
          ref: ${{ needs.request.outputs.release_sha }}
          token: ${{ secrets.DOULY_REPO_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: douly

      - name: Verify immutable checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C douly rev-parse HEAD)" = "$RELEASE_SHA" || {
            echo 'Checked-out Douly SHA does not match approved release SHA'
            exit 1
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy exact approved Douly release to Cloudflare
        working-directory: douly
        run: npx --yes wrangler@4 deploy --config wrangler.jsonc

      - name: Confirm deployed state
        working-directory: douly
        run: npx --yes wrangler@4 deployments status --name douly-app --config wrangler.jsonc
